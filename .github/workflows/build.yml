name: Build GDC Resolve Encoder

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

env:
  PLUGIN_NAME: gdc_resolve_encoder

jobs:
  # ───────────────────────────────────────────────────────────── Linux ──
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libavcodec-dev libavutil-dev libswscale-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Package (Linux-only bundle)
        run: |
          BUNDLE="${{ env.PLUGIN_NAME }}.dvcp.bundle/Contents/Linux-x86-64"
          mkdir -p "$BUNDLE"
          cp build/${{ env.PLUGIN_NAME }}.dvcp "$BUNDLE/"

          mkdir -p dist_linux
          cp -R "${{ env.PLUGIN_NAME }}.dvcp.bundle" dist_linux/
          cp docs/guides/*.pdf dist_linux/

          mkdir -p dist
          cd dist_linux
          zip -r "../dist/gdc-resolve-encoder-linux-x64.zip" .
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: gdc-resolve-encoder-linux-x64
          path: dist/gdc-resolve-encoder-linux-x64.zip

  # ───────────────────────────────────────────────────────── macOS (arm64) ──
  build-macos:
    runs-on: macos-14 # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (Homebrew)
        run: |
          brew install cmake pkg-config ffmpeg

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: cmake --build build --config Release -j

      - name: Package (macOS arm64-only bundle)
        run: |
          BUNDLE="${{ env.PLUGIN_NAME }}.dvcp.bundle/Contents/MacOS"
          mkdir -p "$BUNDLE"
          cp build/${{ env.PLUGIN_NAME }}.dvcp "$BUNDLE/"

          mkdir -p dist_mac
          cp -R "${{ env.PLUGIN_NAME }}.dvcp.bundle" dist_mac/
          cp install.sh dist_mac/
          chmod +x dist_mac/install.sh
          cp docs/guides/*.pdf dist_mac/

          printf '%s\n' \
            'GDC Resolve Encoder - instalare pe Mac' \
            '=======================================' \
            '' \
            'CEL MAI SIMPLU: deschide Terminal in acest folder si ruleaza:' \
            '' \
            '    ./install.sh' \
            '' \
            'Scriptul verifica FFmpeg (il instaleaza prin Homebrew daca lipseste),' \
            'elimina carantina macOS, si copiaza pluginul la locul corect. Iti va' \
            'cere parola (sudo) o singura data, ca sa scrie in folderul de sistem.' \
            '' \
            'Dupa instalare, restart la DaVinci Resolve.' \
            '' \
            '------------------------------------------------------------------' \
            'Manual, daca preferi:' \
            '    xattr -rd com.apple.quarantine gdc_resolve_encoder.dvcp.bundle' \
            '    mv gdc_resolve_encoder.dvcp.bundle "/Library/Application Support/Blackmagic Design/DaVinci Resolve/IOPlugins/"' \
            > dist_mac/CITESTE-MA.txt

          mkdir -p dist
          cd dist_mac
          zip -r "../dist/gdc-resolve-encoder-mac-arm64.zip" .
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: gdc-resolve-encoder-mac-arm64
          path: dist/gdc-resolve-encoder-mac-arm64.zip

  # ───────────────────────────────────────────────────────────── Windows ──
  build-windows:
    runs-on: windows-latest
    continue-on-error: true  # o intrerupere temporara a gyan.dev nu trebuie sa blocheze lansarea Mac/Linux
    steps:
      - uses: actions/checkout@v4

      - name: Download FFmpeg shared dev build
        shell: pwsh
        run: |
          $maxAttempts = 5
          for ($i = 1; $i -le $maxAttempts; $i++) {
            try {
              Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z" -OutFile ffmpeg.7z
              break
            } catch {
              Write-Host "Incercarea $i din $maxAttempts a esuat: $_"
              if ($i -eq $maxAttempts) { throw }
              Start-Sleep -Seconds (15 * $i)
            }
          }
          7z x ffmpeg.7z -offmpeg_extracted
          $dir = Get-ChildItem ffmpeg_extracted | Select-Object -First 1
          Move-Item $dir.FullName -Destination "${{ github.workspace }}\ffmpeg"
          Get-ChildItem "${{ github.workspace }}\ffmpeg\include\libavcodec" | Select-Object -First 5

      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DFFMPEG_ROOT="${{ github.workspace }}\ffmpeg"

      - name: Build
        run: cmake --build build --config Release -j

      - name: Package (Windows-only bundle)
        shell: pwsh
        run: |
          $bundle = "${{ env.PLUGIN_NAME }}.dvcp.bundle\Contents\Win64"
          New-Item -ItemType Directory -Force -Path $bundle
          Copy-Item "build\Release\${{ env.PLUGIN_NAME }}.dvcp" $bundle
          Copy-Item "ffmpeg\bin\avcodec-*.dll" $bundle
          Copy-Item "ffmpeg\bin\avutil-*.dll" $bundle
          Copy-Item "ffmpeg\bin\swscale-*.dll" $bundle
          Copy-Item "ffmpeg\bin\swresample-*.dll" $bundle
          New-Item -ItemType Directory -Force -Path dist_win
          Copy-Item "${{ env.PLUGIN_NAME }}.dvcp.bundle" dist_win -Recurse
          Copy-Item "docs\guides\*.pdf" dist_win

          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path "dist_win\*" -DestinationPath "dist\gdc-resolve-encoder-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: gdc-resolve-encoder-windows-x64
          path: dist/gdc-resolve-encoder-windows-x64.zip

  # ──────────────────────────────────────────────────── GitHub Release ──
  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/gdc-resolve-encoder-mac-arm64/*.zip
            artifacts/gdc-resolve-encoder-windows-x64/*.zip
            artifacts/gdc-resolve-encoder-linux-x64/*.zip
