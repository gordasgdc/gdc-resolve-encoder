name: Build GDC Resolve Encoder (Windows maintenance)

# Windows maintenance edition 1.7.1: built from the v1.7.0 sources with the licence code removed.
# Windows only (no macOS job: the macOS package is built and notarized separately from main).
# A v1.7.1 tag builds the package and creates a DRAFT PRERELEASE; it is published only after the
# plugin has been tested in DaVinci Resolve Studio on Windows. Manual runs only build and upload an artifact.

on:
  push:
    tags: ["v1.7.1*"]
  workflow_dispatch: {}

env:
  PLUGIN_NAME: gdc_resolve_encoder
  FFMPEG_VERSION: "9.0.2"
  FFMPEG_URL: "https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-full_build-shared.7z"
  FFMPEG_SHA256: "4d2060a8b34a940aa47d785142055bb92a63053781e55f2ace4546edd519a8f5"
  PKG_VERSION: "1.7.1"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the pinned FFmpeg build and verify its hash
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile ffmpeg.7z
          $h = (Get-FileHash ffmpeg.7z -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:FFMPEG_SHA256) { throw "FFmpeg archive hash mismatch: $h" }
          7z x ffmpeg.7z -offmpeg_extracted
          $dir = Get-ChildItem ffmpeg_extracted | Select-Object -First 1
          Move-Item $dir.FullName -Destination "${{ github.workspace }}\ffmpeg"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DFFMPEG_ROOT="${{ github.workspace }}\ffmpeg"

      - name: Build
        run: cmake --build build --config Release -j

      - name: Package
        shell: pwsh
        run: |
          $bundle = "${{ env.PLUGIN_NAME }}.dvcp.bundle\Contents\Win64"
          New-Item -ItemType Directory -Force -Path $bundle
          Copy-Item "build\Release\${{ env.PLUGIN_NAME }}.dvcp" $bundle
          foreach ($n in "avcodec","avformat","avutil","swscale","swresample") { Copy-Item "ffmpeg\bin\$n-*.dll" $bundle }

          # LoadLibrary smoke test on the bundled plugin + its FFmpeg DLLs.
          python tests\check_load.py "$bundle\${{ env.PLUGIN_NAME }}.dvcp"
          if ($LASTEXITCODE -ne 0) { throw "check_load.py failed" }

          # The package must contain no licence/activation code path.
          $bin = [System.IO.File]::ReadAllBytes("$bundle\${{ env.PLUGIN_NAME }}.dvcp")
          $txt = [System.Text.Encoding]::ASCII.GetString($bin)
          foreach ($bad in "Licenta invalida", "Cod licenta", "ID masina") { if ($txt.Contains($bad)) { throw "licence string found: $bad" } }

          $pkg = "gdc-resolve-encoder-$env:PKG_VERSION-windows-x64"
          New-Item -ItemType Directory -Force -Path "dist_win"
          Copy-Item "${{ env.PLUGIN_NAME }}.dvcp.bundle" dist_win -Recurse
          Copy-Item install.ps1, install.bat, README_WINDOWS.txt, LICENSE dist_win
          Copy-Item legal dist_win -Recurse
          New-Item -ItemType Directory -Force -Path "dist_win\licenses"
          Copy-Item "ffmpeg\LICENSE" "dist_win\licenses\ffmpeg-gyan-LICENSE-GPLv3.txt"
          Copy-Item "ffmpeg\README.txt" "dist_win\licenses\ffmpeg-gyan-README.txt"
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path "dist_win\*" -DestinationPath "dist\$pkg.zip"
          (Get-FileHash "dist\$pkg.zip" -Algorithm SHA256).Hash.ToLower() + "  $pkg.zip" | Out-File -Encoding ascii "dist\$pkg.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: gdc-resolve-encoder-windows-x64
          retention-days: 30
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v1.7.1')
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gdc-resolve-encoder-windows-x64
          path: artifacts
      - name: Extract the release notes from CHANGELOG.md
        run: |
          awk -v v="## v1.7.1 " 'index($0, v)==1 {p=1; next} /^## /{p=0} p' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create draft prerelease
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          make_latest: "false"
          body_path: notes.md
          files: artifacts/*
          fail_on_unmatched_files: true
