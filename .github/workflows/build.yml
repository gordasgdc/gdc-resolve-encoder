name: Build GDC Resolve Encoder

# The macOS package (GDCResolveEncoder-<version>.pkg) is built, signed and
# notarized locally with the Developer ID certificates (they are not in CI),
# together with the corresponding-source archive (scripts/make_corresponding_source.sh).
# On a v* tag this workflow therefore (1) checks that the tagged source builds and
# its tests pass, and (2) creates a DRAFT release with the notes from CHANGELOG.md.
# The verified package and the source archive are attached afterwards by
# scripts/publish_release.sh, which checks their SHA-256 before publishing, so the
# "latest" release never exists without the package. Windows development is
# suspended: no new Windows package is built or attached (the last published one,
# v1.7.0, stays available); the Windows job runs only on manual dispatch.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

env:
  PLUGIN_NAME: gdc_resolve_encoder

jobs:
  # Build + unit tests of the tagged source (not the shipped package: the CI runner
  # has an older SDK, so it builds with a lower deployment target).
  check-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps (Homebrew)
        run: brew install cmake pkg-config ffmpeg
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
      - name: Build
        run: cmake --build build --config Release -j
      - name: Unit tests (pixel conversion, containers)
        run: |
          cmake --build build --target pixconv_test mux_roundtrip -j
          ./build/pixconv_test
          tests/run_mux_tests.sh ./build/mux_roundtrip "$RUNNER_TEMP/mux"

  # Manual dispatch only: Windows is not maintained; nothing here is attached to a release.
  build-windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Download FFmpeg shared dev build
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z" -OutFile ffmpeg.7z
          7z x ffmpeg.7z -offmpeg_extracted
          $dir = Get-ChildItem ffmpeg_extracted | Select-Object -First 1
          Move-Item $dir.FullName -Destination "${{ github.workspace }}\ffmpeg"
      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DFFMPEG_ROOT="${{ github.workspace }}\ffmpeg"
          cmake --build build --config Release -j

  # Draft release with the notes for this version. Assets are added by scripts/publish_release.sh.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract the release notes from CHANGELOG.md
        run: |
          VER="${GITHUB_REF_NAME}"
          awk -v v="## ${VER} " 'index($0, v)==1 {p=1; next} /^## /{p=0} p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md section for ${VER}"; exit 1; }
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: notes.md
          fail_on_unmatched_files: true
